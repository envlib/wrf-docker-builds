services:
  wrf:
    image: mullenkamp/wrf-wps-intel-wvt-ubuntu:1.3
    build:
      context: ../
      dockerfile: wrf-wps-intel-wvt/Dockerfile
    stdin_open: true
    tty: true
    shm_size: '1gb'
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /media/data/WRF/testing:/testing
      - wps-geog:/WPS_GEOG

volumes:
  wps-geog:
    external: true
