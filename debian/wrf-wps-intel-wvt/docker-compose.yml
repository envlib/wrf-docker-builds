services:
  wrf:
    image: mullenkamp/wrf-wps-intel-wvt-ubuntu:2.8   # 2.8 (2026-10-05): GEOGRID.TBL HGT_M falls back to GMTED2010 outside the LINZ DEM (before: 0 m on every land cell outside NZ); 2.7 (2026-09-29): start_em's init-time pld/zld get DRY theta (th_phy_m_t0), so the first p/z-level frame of a run (cold start t=0, every restart 0h) is no longer warm-biased; 2.6 (2026-09-19): the tracer3dsource/3dsink rule no longer refuses tracer2dsource without WVT (2.5's rule broke tracer-off namelists); 2.5 (2026-09-18): WVT state Registry-packaged + core-avx2
    build:
      context: ../
      dockerfile: wrf-wps-intel-wvt/Dockerfile
      args:
        # AVX2 baseline (every Intel since 2013, every AMD since Zen): ~3% faster than the stock
        # no-march build, output identical on the harness. In effect from :2.5 (2026-09-18); :2.4
        # and earlier are plain x86-64. The AVX-512 variant lives in ../wrf-wps-intel-wvt-avx512/.
        # Record: wrf-model-eval/docs/wvt_tracer_cost_assessment.md sec 3.7.
        WRF_MARCH: core-avx2
    stdin_open: true
    tty: true
    shm_size: '2gb'   # >=2gb required for multi-rank Intel MPI (mpirun -n N); 1gb SIGBUSes
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /media/data/WRF/testing:/testing
      - wps-geog:/WPS_GEOG

volumes:
  wps-geog:
    external: true
