services:
  wrf-wps-intel:
    build:
      context: ../
      dockerfile: wrf-wps-intel/Dockerfile
    image: mullenkamp/wrf-wps-intel-ubuntu:1.1   # 1.1 (2026-10-05): GEOGRID.TBL HGT_M falls back to GMTED2010 outside the LINZ DEM (before: 0 m on every land cell outside NZ)
    stdin_open: true # docker run -i
    tty: true        # docker run -t
    shm_size: '1gb'
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - type: bind
        source: ~/.Xauthority
        target: /root/.Xauthority
      - type: bind
        source: ~/data/wrf/tests
        target: /data/
      - type: bind
        source: ~/data/wrf/WPS_GEOG
        target: /WPS_GEOG/
