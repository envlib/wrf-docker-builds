# AVX-512 variant of wrf-wps-intel-wvt: SAME Dockerfile and SAME wvt-multi source, built with
# WRF_MARCH=skylake-avx512. Separate image name because the binary needs AVX-512 (Zen 4 / Genoa:
# Hetzner AX162, NeSI genoa, UC RCH) and refuses to start elsewhere; the un-suffixed image stays
# generic x86-64. Version numbering is this image's own (1.0 = built from the same source as
# wrf-wps-intel-wvt-ubuntu:2.4 plus the flag).
services:
  wrf:
    image: mullenkamp/wrf-wps-intel-wvt-ubuntu-avx512:1.0
    build:
      context: ../
      dockerfile: wrf-wps-intel-wvt/Dockerfile
      args:
        WRF_MARCH: skylake-avx512
    stdin_open: true
    tty: true
    shm_size: '2gb'   # >=2gb required for multi-rank Intel MPI (mpirun -n N); 1gb SIGBUSes
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /media/data/WRF/testing:/testing
      - wps-geog:/WPS_GEOG

volumes:
  wps-geog:
    external: true
